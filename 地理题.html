<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理离谱单选题答题挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* 修复空格 */
            font-family: 'Microsoft YaHei', 'Heiti SC', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); /* 修复空格 */
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }
        /* 顶部装饰渐变 */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #4361ee, #7209b7, #f72585); /* 修复空格 */
        }
        .header {
            background: linear-gradient(90deg, #4361ee 0%, #3a0ca3 100%); /* 修复空格 */
            color: #fff;
            padding: 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* 头部装饰光点 */
        .header::after {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            font-weight: 700;
        }
        .header p {
            font-size: 16px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }
        .tab-container {
            display: flex;
            overflow-x: auto;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            scrollbar-width: none;
            padding: 0 10px;
        }
        .tab-container::-webkit-scrollbar { /* 修复空格 */
            display: none;
        }
        .tab {
            padding: 18px 28px;
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            white-space: nowrap;
            transition: all 0.3s ease;
            position: relative;
        }
        .tab.active {
            color: #4361ee;
            border-bottom-color: #4361ee;
            background: rgba(67, 97, 238, 0.04);
        }
        .tab:hover {
            color: #3a0ca3;
            background: rgba(67, 97, 238, 0.02);
            transform: translateY(-1px);
        }
        .quiz-content {
            padding: 40px;
            display: none;
        }
        .quiz-content.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { /* 修复空格 */
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #f1f5f9;
        }
        .question-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        .question-title {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            font-weight: 600;
        }
        .question-title::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 24px;
            background: linear-gradient(180deg, #4361ee, #7209b7); /* 修复空格 */
            border-radius: 3px;
            margin-right: 15px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }
        .option {
            padding: 16px 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            color: #334155;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-weight: 500;
        }
        .option:hover {
            border-color: #4361ee;
            background: rgba(67, 97, 238, 0.06);
            transform: translateX(3px);
        }
        .option.selected {
            border-color: #4361ee;
            background: rgba(67, 97, 238, 0.12);
            color: #4361ee;
            font-weight: 600;
        }
        /* 新增：错误选项样式 */
        .option.wrong {
            border-color: #ed64a6;
            background: rgba(237, 100, 166, 0.12);
            color: #ed64a6;
            font-weight: 600;
        }
        .option.selected::after,
        .option.wrong::after {
            content: "✓";
            margin-left: auto;
            font-size: 20px;
            font-weight: bold;
        }
        /* 新增：错误选项的对勾颜色 */
        .option.wrong::after {
            content: "✕";
            color: #ed64a6;
        }
        .answer-btn {
            padding: 14px 30px;
            background: linear-gradient(90deg, #4361ee, #3a0ca3); /* 修复空格 */
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.2);
        }
        .answer-btn:hover {
            background: linear-gradient(90deg, #3a0ca3, #7209b7); /* 修复空格 */
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.3);
        }
        .answer-btn:disabled {
            background: #cbd5e1;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .answer-result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .correct {
            background: rgba(72, 187, 120, 0.1);
            border-left: 5px solid #48bb78;
        }
        .incorrect {
            background: rgba(237, 100, 166, 0.1);
            border-left: 5px solid #ed64a6;
        }
        .answer-result h4 {
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .correct h4 {
            color: #2f9e69;
        }
        .incorrect h4 {
            color: #d63384;
        }
        .answer-result p {
            font-size: 16px;
            color: #475569;
            line-height: 1.7;
        }
        .analysis {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #e2e8f0;
            font-size: 15px;
            color: #64748b;
            line-height: 1.7;
        }
        .page-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #f1f5f9;
        }
        .page-btn {
            padding: 12px 24px;
            background: #fff;
            border: 2px solid #4361ee;
            border-radius: 10px;
            color: #4361ee;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .page-btn:hover {
            background: #4361ee;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }
        .page-btn:disabled {
            border-color: #e2e8f0;
            color: #94a3b8;
            background: #f8fafc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .page-info {
            font-size: 16px;
            color: #334155;
            font-weight: 600;
            background: #f1f5f9;
            padding: 8px 20px;
            border-radius: 20px;
        }
        /* 响应式设计 */
        @media(max-width: 768px) {
            .header h1 {
                font-size: 26px;
            }
            .tab {
                padding: 14px 20px;
                font-size: 14px;
            }
            .quiz-content {
                padding: 24px 20px;
            }
            .question-title {
                font-size: 18px;
            }
            .option {
                font-size: 15px;
                padding: 14px 16px;
            }
            .answer-btn,
            .page-btn {
                font-size: 15px;
                padding: 12px 20px;
            }
            .page-info {
                font-size: 14px;
                padding: 6px 16px;
            }
            .question-item {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>地理离谱单选题答题挑战</h1>
            <p>点击选项作答，提交后查看答案及解析</p>
        </div>

        <div class="tab-container">
            <div class="tab active" data-tab="plant">自然地理·植物篇</div>
            <div class="tab" data-tab="animal">自然地理·动物篇</div>
            <div class="tab" data-tab="climate">自然地理·气候地貌篇</div>
            <div class="tab" data-tab="city">人文地理·城市交通篇</div>
            <div class="tab" data-tab="food">人文地理·饮食农业篇</div>
            <div class="tab" data-tab="custom">人文地理·民俗区域篇</div>
        </div>

        <!--通用答题容器，动态渲染内容-->
        <div class="quiz-content active" id="plant">
            <div class="question-list" id="plant-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-plant" disabled>← 上一题</button>

                <button class="page-btn" id="next-plant">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="animal">
            <div class="question-list" id="animal-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-animal" disabled>← 上一题</button>
                <span class="page-info" id="page-animal">第 1 / 15 题</span>
                <button class="page-btn" id="next-animal">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="climate">
            <div class="question-list" id="climate-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-climate" disabled>← 上一题</button>
                <span class="page-info" id="page-climate">第 1 / 6 题</span>
                <button class="page-btn" id="next-climate">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="city">
            <div class="question-list" id="city-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-city" disabled>← 上一题</button>
                <span class="page-info" id="page-city">第 1 / 3 题</span>
                <button class="page-btn" id="next-city">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="food">
            <div class="question-list" id="food-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-food" disabled>← 上一题</button>
                <span class="page-info" id="page-food">第 1 / 3 题</span>
                <button class="page-btn" id="next-food">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="custom">
            <div class="question-list" id="custom-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-custom" disabled>← 上一题</button>
                <span class="page-info" id="page-custom">第 1 / 3 题</span>
                <button class="page-btn" id="next-custom">下一题 →</button>
            </div>
        </div>
    </div>

    <script>
        // 完整题目数据
        const quizData = {
            plant: [{
                id: 1,
                title: "为什么沙漠里的仙人掌从不会迷路？（）",
                options: {
                    A: "根系能感知地下水方向",
                    B: "自带“沙漠GPS”（刺的朝向指向绿洲）",
                    C: "懒得动，根本不需要找路",
                    D: "跟着骆驼的脚印走"
                },
                correct: "C",
                explanation: "仙人掌属于植物，根系固定在土壤中无法移动，自然不需要“找路”，C选项的离谱设定恰好贴合植物的生长特性。",
                analysis: "从地理角度，仙人掌为适应沙漠环境，根系发达且固定生长，无法自主移动，所谓“迷路”本身对植物不成立，选项C以幽默方式点出核心逻辑。"
            }, {
                id: 2,
                title: "热带雨林的树木为什么长得特别高？（）",
                options: {
                    A: "为了争夺阳光，卷生卷死",
                    B: "想触摸云朵，实现“树生理想”",
                    C: "怕被地面的虫子啃食",
                    D: "被其他植物排挤被迫长高"
                },
                correct: "A",
                explanation: "热带雨林植被茂密，下层光照稀缺，树木通过长高争夺上层阳光，保障光合作用，是自然竞争的结果。",
                analysis: "热带雨林气候湿热，植被垂直分层明显，光照是植物生长的关键资源，高大乔木通过拔高生长占据光照优势，形成独特的雨林景观。"
            }, {
                id: 3,
                title: "苔藓为什么总喜欢长在阴暗潮湿处？（）",
                options: {
                    A: "怕晒黑，注重“皮肤管理”",
                    B: "根系不发达，需保持水分",
                    C: "喜欢躲猫猫，不想被人类发现",
                    D: "阴暗处有更多微生物当食物"
                },
                correct: "B",
                explanation: "苔藓没有真正的根，只有假根起固定作用，无法吸收深层水分，阴暗潮湿环境能帮它保持体表水分，避免干枯。",
                analysis: "从植物地理学角度，苔藓属于苔藓植物门，结构简单，保水能力弱，阴暗潮湿的环境可满足其生长对水分的需求，是典型的环境适应性特征。"
            }, {
                id: 4,
                title: "红树林为什么能在海边扎根？（）",
                options: {
                    A: "根系会“抓地功”，不怕海浪冲",
                    B: "自带“盐过滤器”，能排海水盐分",
                    C: "和海浪达成约定，互不打扰",
                    D: "靠渔民定期加固根系"
                },
                correct: "B",
                explanation: "红树林的根系和叶片具有特殊泌盐结构，能将吸收的海水盐分排出体外，同时根系发达可抵御海浪侵蚀，适应滨海环境。",
                analysis: "红树林是滨海湿地特有的植被，主要分布在热带、亚热带沿海，其泌盐机制和发达根系是适应高盐、风浪环境的核心地理适应性特征。"
            }, {
                id: 5,
                title: "向日葵为什么总跟着太阳转？（）",
                options: {
                    A: "怕太阳孤单，主动陪伴",
                    B: "花盘需阳光烘干露水",
                    C: "想收集更多阳光当“能量补给”",
                    D: "跟着太阳找方向，避免迷路"
                },
                correct: "C",
                explanation: "向日葵花盘背面的生长素对光敏感，光照会让生长素转移，导致花盘向光弯曲，目的是让花盘充分接受阳光，促进光合作用和种子发育。",
                analysis: "从植物生长规律看，向日葵的向光性是生长素分布不均导致的，本质是为了获取更多光照资源，提升生长效率，是植物对光照的适应性反应。"
            }, {
                id: 6,
                title: "竹子为什么长得特别快？（）",
                options: {
                    A: "有“快速生长buff”，每天必长高",
                    B: "怕被其他植物遮挡阳光",
                    C: "想尽快长成竹子，供人类使用",
                    D: "根系储存养分多，集中爆发生长"
                },
                correct: "D",
                explanation: "竹子的地下茎（竹鞭）会长期储存大量养分，一旦进入生长季，养分集中供给竹笋，使其能快速拔节生长，部分品种每天可长高几十厘米。",
                analysis: "竹子属于禾本科植物，其独特的地下茎繁殖和养分储存机制，使其具备快速生长的特性，适应森林环境中争夺光照的竞争需求。"
            }, {
                id: 7,
                title: "荷花为什么能浮在水面上？（）",
                options: {
                    A: "叶子自带“浮力气垫”，不会下沉",
                    B: "水神眷顾，不让它沉底",
                    C: "叶子表面积大，浮力足够",
                    D: "靠荷叶下的小鱼托举"
                },
                correct: "C",
                explanation: "荷叶表面积大且质地轻薄，叶片背面有蜡质层，能减少水分吸附，同时叶柄中空通气，整体浮力大于重力，可平稳浮在水面。",
                analysis: "荷花是水生植物，其叶片和叶柄的结构的适应水生环境的结果，大表面积能提升浮力，蜡质层可防止叶片被水浸透，保障光合作用正常进行。"
            }, {
                id: 8,
                title: "胡杨为什么能在沙漠存活千年？（）",
                options: {
                    A: "有“长生秘诀”，能抵抗衰老",
                    B: "根系扎得极深，可吸收深层地下水",
                    C: "沙漠环境单纯，少病虫害",
                    D: "靠过往旅人浇水存活"
                },
                correct: "B",
                explanation: "胡杨的根系可深入地下数十米，直达深层地下水层，同时树干能储存水分，叶片可调节蒸腾作用，适应沙漠干旱环境，寿命可达千年。",
                analysis: "胡杨是温带荒漠地区的典型树种，被誉为“沙漠脊梁”，其深根系、储水能力和抗旱叶片结构，是适应沙漠极端干旱环境的关键地理特征。"
            }, {
                id: 9,
                title: "含羞草为什么一碰就合拢叶子？（）",
                options: {
                    A: "害羞，被碰后不好意思展开",
                    B: "怕被虫子啃食，假装枯萎",
                    C: "叶片敏感，能感知外界刺激",
                    D: "想躲起来，不被人类触碰"
                },
                correct: "C",
                explanation: "含羞草叶片和叶柄连接处有“叶枕”，内含大量水分，触碰时叶枕失水收缩，带动叶片合拢，这是一种对外界刺激的应激反应。",
                analysis: "含羞草的感震性是植物对外界刺激的防御性反应，可减少昆虫啃食和风雨损伤，是植物适应环境的一种生理机制，常见于热带、亚热带地区。"
            }, {
                id: 10,
                title: "茶树为什么适合长在山区？（）",
                options: {
                    A: "喜欢登高望远，享受山景",
                    B: "山区气温适宜、云雾多，茶叶口感好",
                    C: "山区少人打扰，能安心生长",
                    D: "靠山风传播种子，扩大生长范围"
                },
                correct: "B",
                explanation: "山区海拔较高，气温适中，昼夜温差大，且云雾多、光照柔和，能促进茶叶中氨基酸、茶多酚等物质合成，提升口感和品质。",
                analysis: "茶树喜温暖湿润、光照柔和的环境，山区的地形和气候条件恰好契合其生长需求，我国名茶多产自山区，如黄山毛峰、武夷岩茶等。"
            }],
            animal: [{
                id: 1,
                title: "骆驼为什么能在沙漠长时间不喝水？（）",

            analysis: "人文景观的崇拜价值与历史、宗教、权力结构密切相关，金字塔的崇拜文化体现了古埃及的社会结构和宗教信仰，是人文地理中文化景观与社会文化的深度融合。"
        }, {
            id: 20,
            title: "为什么中国人喜欢在清明节扫墓？（）",
            options: {
                A: "缅怀祖先，传承孝道文化",
                B: "清明节气候适宜，适合户外活动",
                C: "传统习俗，一直延续",
                D: "清明节是春季，万物复苏，纪念祖先"
            },
            correct: "A",
            explanation: "清明节扫墓是中国传统孝道文化的重要体现，通过祭拜祖先表达缅怀之情，传承家族记忆和孝道观念，是连接祖先与后代的文化纽带。",
            analysis: "民俗活动往往承载着核心文化价值，清明节扫墓习俗体现了中国传统文化中的孝道观念和家族情怀，是人文习俗与文化传承的重要载体。"

        };

        // 全局状态管理
const state = {
    currentTab: "plant",
    pageIndex: {
        plant: 0,
        animal: 0,
        climate: 0,
        city: 0,
        food: 0,
        custom: 0
    },
    selectedOption: {}, // 临时存储当前题选中选项
    answerRecords: {    // 留存所有题的答题记录（刷新清空）
        plant: {},
        animal: {},
        climate: {},
        city: {},
        food: {},
        custom: {}
    }
};
        // 初始化页面
        function init() {
            // 渲染默认标签的题目
            renderQuestion("plant", 0);
            // 绑定标签切换事件
            bindTabEvents();
            // 绑定分页事件
            bindPageEvents();
        }

        // 渲染题目（含答题记录恢复）
function renderQuestion(tabKey, index) {
    const questionList = document.getElementById(`${tabKey}-list`);
    const questions = quizData[tabKey];
    const currentQ = questions[index];
    const record = state.answerRecords[tabKey][index] || {}; // 获取当前题的答题记录

    // 清空原有内容
    questionList.innerHTML = `
        <div class="question-item">
            <div class="question-title">${currentQ.title}</div>
            <div class="options">
                ${Object.entries(currentQ.options).map(([key, value]) => `
                    <div class="option ${record.selected === key ? (record.isCorrect ? 'selected' : 'wrong') : (record.correct === key ? 'selected' : '')}" data-option="${key}">${key}. ${value}</div>
                `).join('')}
            </div>
            <button class="answer-btn" id="submit-${tabKey}" ${record.submitted ? 'disabled' : ''}>提交答案</button>
            <div class="answer-result ${record.isCorrect ? 'correct' : record.submitted ? 'incorrect' : ''}" id="result-${tabKey}" style="${record.submitted ? 'display:block' : 'display:none'}">
                <h4 id="result-title-${tabKey}">${record.isCorrect ? '✅ 回答正确！' : record.submitted ? '❌ 回答错误！' : ''}</h4>
                <p id="result-desc-${tabKey}">${record.submitted ? (record.isCorrect ? currentQ.explanation : `正确答案是：${currentQ.correct}. ${currentQ.options[currentQ.correct]}，${currentQ.explanation}`) : ''}</p>
                <div class="analysis" id="result-analysis-${tabKey}">${record.submitted ? currentQ.analysis : ''}</div>
            </div>
        </div>
    `;

    // 绑定选项选择事件
    bindOptionEvents(tabKey);
    // 绑定提交答案事件
    bindSubmitEvent(tabKey);
    // 恢复临时选中状态（未提交时）
    if (!record.submitted) {
        state.selectedOption[tabKey] = record.selected || null;
    }
}

        // 绑定标签切换事件
        function bindTabEvents() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    // 移除所有标签和内容的active状态
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.quiz-content').forEach(c => c.classList.remove('active'));
                    // 添加当前标签和内容的active状态
                    this.classList.add('active');
                    const tabKey = this.dataset.tab;
                    state.currentTab = tabKey;
                    document.getElementById(tabKey).classList.add('active');
                    // 渲染当前标签的当前页题目
                    renderQuestion(tabKey, state.pageIndex[tabKey]);
                    // 更新分页按钮状态
                    updatePageBtnStatus(tabKey);
                });
            });
        }

        // 绑定选项选择事件（含临时状态记录）
function bindOptionEvents(tabKey) {
    const options = document.querySelectorAll(`#${tabKey}-list .option`);
    options.forEach(option => {
        option.addEventListener('click', function() {
            const index = state.pageIndex[tabKey];
            // 未提交时才允许修改选中状态
            if (!state.answerRecords[tabKey][index]?.submitted) {
                // 移除所有选项的选中状态
                options.forEach(opt => opt.classList.remove('selected', 'wrong'));
                // 添加当前选项的选中状态
                this.classList.add('selected');
                // 记录选中的选项（临时+持久）
                state.selectedOption[tabKey] = this.dataset.option;
                state.answerRecords[tabKey][index] = {
                    ...state.answerRecords[tabKey][index],
                    selected: this.dataset.option,
                    submitted: false // 未提交
                };
            }
        });
    });
}

        // 绑定提交答案事件（含记录保存）
function bindSubmitEvent(tabKey) {
    const submitBtn = document.getElementById(`submit-${tabKey}`);
    submitBtn.addEventListener('click', function() {
        const selected = state.selectedOption[tabKey];
        if (!selected) {
            alert("请先选择一个选项！");
            return;
        }

        const index = state.pageIndex[tabKey];
        const questions = quizData[tabKey];
        const currentQ = questions[index];
        const resultEl = document.getElementById(`result-${tabKey}`);
        const titleEl = document.getElementById(`result-title-${tabKey}`);
        const descEl = document.getElementById(`result-desc-${tabKey}`);
        const analysisEl = document.getElementById(`result-analysis-${tabKey}`);

        // 禁用提交按钮
        submitBtn.disabled = true;

        // 判断答案是否正确
        const isCorrect = selected === currentQ.correct;
        if (isCorrect) {
            // 正确
            resultEl.className = "answer-result correct";
            titleEl.innerHTML = "✅ 回答正确！";
            descEl.textContent = currentQ.explanation;
            analysisEl.textContent = currentQ.analysis;
        } else {
            // 错误，标记错误选项和正确选项
            const options = document.querySelectorAll(`#${tabKey}-list .option`);
            options.forEach(opt => {
                if (opt.dataset.option === selected) {
                    opt.classList.add('wrong');
                    opt.classList.remove('selected');
                }
                if (opt.dataset.option === currentQ.correct) {
                    opt.classList.add('selected');
                }
            });
            resultEl.className = "answer-result incorrect";
            titleEl.innerHTML = "❌ 回答错误！";
            descEl.textContent = `正确答案是：${currentQ.correct}. ${currentQ.options[currentQ.correct]}，${currentQ.explanation}`;
            analysisEl.textContent = currentQ.analysis;
        }

        // 保存答题记录到state
        state.answerRecords[tabKey][index] = {
            selected: selected,       // 选中的选项
            correct: currentQ.correct,// 正确答案
            isCorrect: isCorrect,     // 是否正确
            submitted: true           // 是否提交过
        };

        // 显示结果
        resultEl.style.display = "block";
    });
}

        // 绑定分页事件
        function bindPageEvents() {
            // 遍历所有标签，绑定上一题/下一题事件
            Object.keys(quizData).forEach(tabKey => {
                // 上一题
                const prevBtn = document.getElementById(`prev-${tabKey}`);
                if (prevBtn) {
                    prevBtn.addEventListener('click', function() {
                        state.pageIndex[tabKey]--;
                        renderQuestion(tabKey, state.pageIndex[tabKey]);
                        updatePageBtnStatus(tabKey);
                    });
                }
                // 下一题
                const nextBtn = document.getElementById(`next-${tabKey}`);
                if (nextBtn) {
                    nextBtn.addEventListener('click', function() {
                        state.pageIndex[tabKey]++;
                        renderQuestion(tabKey, state.pageIndex[tabKey]);
                        updatePageBtnStatus(tabKey);
                    });
                }
            });
        }

        // 更新分页按钮状态（禁用/启用）
        function updatePageBtnStatus(tabKey) {
            const prevBtn = document.getElementById(`prev-${tabKey}`);
            const nextBtn = document.getElementById(`next-${tabKey}`);
            const pageInfo = document.getElementById(`page-${tabKey}`);
            const total = quizData[tabKey].length;
            const current = state.pageIndex[tabKey] + 1;

            // 更新页码显示
            pageInfo.textContent = `第 ${current} / ${total} 题`;

            // 禁用/启用上一题按钮
            prevBtn.disabled = state.pageIndex[tabKey] === 0;
            // 禁用/启用下一题按钮
            nextBtn.disabled = state.pageIndex[tabKey] === total - 1;
        }

        // 初始化
        window.onload = init;
    </script>
</body>
