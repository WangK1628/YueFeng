<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史离谱单选题答题挑战（春秋-1978）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Heiti SC', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #e63946, #f77f00, #fcbf49);
        }
        .header {
            background: linear-gradient(90deg, #e63946 0%, #d62828 100%);
            color: #fff;
            padding: 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            font-weight: 700;
        }
        .header p {
            font-size: 16px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }
        .tab-container {
            display: flex;
            overflow-x: auto;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            scrollbar-width: none;
            padding: 0 10px;
        }
        .tab-container::-webkit-scrollbar {
            display: none;
        }
        .tab {
            padding: 18px 28px;
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            white-space: nowrap;
            transition: all 0.3s ease;
            position: relative;
        }
        .tab.active {
            color: #e63946;
            border-bottom-color: #e63946;
            background: rgba(230, 57, 70, 0.04);
        }
        .tab:hover {
            color: #d62828;
            background: rgba(230, 57, 70, 0.02);
            transform: translateY(-1px);
        }
        .quiz-content {
            padding: 40px;
            display: none;
        }
        .quiz-content.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #f1f5f9;
        }
        .question-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        .question-title {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            font-weight: 600;
        }
        .question-title::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 24px;
            background: linear-gradient(180deg, #e63946, #f77f00);
            border-radius: 3px;
            margin-right: 15px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }
        .option {
            padding: 16px 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            color: #334155;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-weight: 500;
        }
        .option:hover {
            border-color: #e63946;
            background: rgba(230, 57, 70, 0.06);
            transform: translateX(3px);
        }
        .option.selected {
            border-color: #e63946;
            background: rgba(230, 57, 70, 0.12);
            color: #e63946;
            font-weight: 600;
        }
        .option.wrong {
            border-color: #ed64a6;
            background: rgba(237, 100, 166, 0.12);
            color: #ed64a6;
            font-weight: 600;
        }
        .option.selected::after,
        .option.wrong::after {
            content: "✓";
            margin-left: auto;
            font-size: 20px;
            font-weight: bold;
        }
        .option.wrong::after {
            content: "✕";
            color: #ed64a6;
        }
        .answer-btn {
            padding: 14px 30px;
            background: linear-gradient(90deg, #e63946, #d62828);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.2);
        }
        .answer-btn:hover {
            background: linear-gradient(90deg, #d62828, #f77f00);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.3);
        }
        .answer-btn:disabled {
            background: #cbd5e1;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .answer-result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .correct {
            background: rgba(72, 187, 120, 0.1);
            border-left: 5px solid #48bb78;
        }
        .incorrect {
            background: rgba(237, 100, 166, 0.1);
            border-left: 5px solid #ed64a6;
        }
        .answer-result h4 {
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .correct h4 {
            color: #2f9e69;
        }
        .incorrect h4 {
            color: #d63384;
        }
        .answer-result p {
            font-size: 16px;
            color: #475569;
            line-height: 1.7;
        }
        .analysis {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #e2e8f0;
            font-size: 15px;
            color: #64748b;
            line-height: 1.7;
        }
        .page-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #f1f5f9;
        }
        .page-btn {
            padding: 12px 24px;
            background: #fff;
            border: 2px solid #e63946;
            border-radius: 10px;
            color: #e63946;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .page-btn:hover {
            background: #e63946;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.2);
        }
        .page-btn:disabled {
            border-color: #e2e8f0;
            color: #94a3b8;
            background: #f8fafc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .page-info {
            font-size: 16px;
            color: #334155;
            font-weight: 600;
            background: #f1f5f9;
            padding: 8px 20px;
            border-radius: 20px;
        }
        @media(max-width: 768px) {
            .header h1 {
                font-size: 26px;
            }
            .tab {
                padding: 14px 20px;
                font-size: 14px;
            }
            .quiz-content {
                padding: 24px 20px;
            }
            .question-title {
                font-size: 18px;
            }
            .option {
                font-size: 15px;
                padding: 14px 16px;
            }
            .answer-btn,
            .page-btn {
                font-size: 15px;
                padding: 12px 20px;
            }
            .page-info {
                font-size: 14px;
                padding: 6px 16px;
            }
            .question-item {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>历史离谱单选题答题挑战（春秋-1978）</h1>
            <p>点击选项作答，提交后查看答案及解析</p>
        </div>

        <div class="tab-container">
            <div class="tab active" data-tab="springAutumn">春秋篇</div>
            <div class="tab" data-tab="warringStates">战国篇</div>
            <div class="tab" data-tab="qinHan">秦汉篇</div>
            <div class="tab" data-tab="tangSong">唐宋篇</div>
            <div class="tab" data-tab="mingQing">明清篇</div>
            <div class="tab" data-tab="modern">近现代篇（1840-1978）</div>
        </div>

        <!-- 通用答题容器，动态渲染内容 -->
        <div class="quiz-content active" id="springAutumn">
            <div class="question-list" id="springAutumn-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-springAutumn" disabled>← 上一题</button>
                <span class="page-info" id="page-springAutumn">第 1 / 2 题</span>
                <button class="page-btn" id="next-springAutumn">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="warringStates">
            <div class="question-list" id="warringStates-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-warringStates" disabled>← 上一题</button>
                <span class="page-info" id="page-warringStates">第 1 / 2 题</span>
                <button class="page-btn" id="next-warringStates">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="qinHan">
            <div class="question-list" id="qinHan-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-qinHan" disabled>← 上一题</button>
                <span class="page-info" id="page-qinHan">第 1 / 2 题</span>
                <button class="page-btn" id="next-qinHan">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="tangSong">
            <div class="question-list" id="tangSong-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-tangSong" disabled>← 上一题</button>
                <span class="page-info" id="page-tangSong">第 1 / 2 题</span>
                <button class="page-btn" id="next-tangSong">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="mingQing">
            <div class="question-list" id="mingQing-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-mingQing" disabled>← 上一题</button>
                <span class="page-info" id="page-mingQing">第 1 / 2 题</span>
                <button class="page-btn" id="next-mingQing">下一题 →</button>
            </div>
        </div>

        <div class="quiz-content" id="modern">
            <div class="question-list" id="modern-list"></div>
            <div class="page-nav">
                <button class="page-btn" id="prev-modern" disabled>← 上一题</button>
                <span class="page-info" id="page-modern">第 1 / 2 题</span>
                <button class="page-btn" id="next-modern">下一题 →</button>
            </div>
        </div>
    </div>

    <script>
        // 存储当前各分类的答题状态
        const quizState = {
            springAutumn: { current: 0, selected: null, answered: false },
            warringStates: { current: 0, selected: null, answered: false },
            qinHan: { current: 0, selected: null, answered: false },
            tangSong: { current: 0, selected: null, answered: false },
            mingQing: { current: 0, selected: null, answered: false },
            modern: { current: 0, selected: null, answered: false }
        };

        // 加载JSON数据并初始化页面
        fetch('history-quiz.json')
            .then(response => {
                if (!response.ok) throw new Error('JSON文件加载失败');
                return response.json();
            })
            .then(quizData => {
                // 初始化标签切换
                initTabSwitch();
                // 初始化各分类题目
                Object.keys(quizData).forEach(type => {
                    renderQuestion(type, quizData);
                    initPageNav(type, quizData);
                });
            })
            .catch(error => {
                console.error('加载失败:', error);
                alert('题目数据加载失败，请检查JSON文件是否存在或格式是否正确！');
            });

        // 初始化标签切换
        function initTabSwitch() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // 移除所有激活状态
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.quiz-content').forEach(c => c.classList.remove('active'));
                    // 添加当前激活状态
                    tab.classList.add('active');
                    const tabId = tab.dataset.tab;
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }

        // 渲染指定分类的当前题目
        function renderQuestion(type, quizData) {
            const state = quizState[type];
            const questionList = document.getElementById(`${type}-list`);
            const currentQuestion = quizData[type][state.current];

            // 清空原有内容
            questionList.innerHTML = '';

            // 创建题目容器
            const questionItem = document.createElement('div');
            questionItem.className = 'question-item';

            // 题目标题
            const questionTitle = document.createElement('div');
            questionTitle.className = 'question-title';
            questionTitle.textContent = currentQuestion.title;
            questionItem.appendChild(questionTitle);

            // 选项容器
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options';

            // 生成选项
            Object.entries(currentQuestion.options).forEach(([key, value]) => {
                const option = document.createElement('div');
                option.className = 'option';
                option.dataset.key = key;
                option.textContent = `${key}：${value}`;

                // 如果已选择/已答题，设置对应样式
                if (state.selected === key) {
                    option.classList.add('selected');
                } else if (state.answered && key !== currentQuestion.correct && state.selected !== currentQuestion.correct) {
                    option.classList.add('wrong');
                } else if (state.answered && key === currentQuestion.correct && state.selected !== key) {
                    option.classList.add('selected');
                }

                // 选项点击事件（未答题时可选择）
                if (!state.answered) {
                    option.addEventListener('click', () => {
                        // 移除其他选项的选中状态
                        optionsContainer.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                        // 设置当前选中
                        option.classList.add('selected');
                        state.selected = key;
                        // 启用提交按钮
                        const answerBtn = questionItem.querySelector('.answer-btn');
                        if (answerBtn) answerBtn.disabled = false;
                    });
                }

                optionsContainer.appendChild(option);
            });
            questionItem.appendChild(optionsContainer);

            // 提交按钮
            const answerBtn = document.createElement('button');
            answerBtn.className = 'answer-btn';
            answerBtn.textContent = '提交答案';
            answerBtn.disabled = !state.selected;
            answerBtn.addEventListener('click', () => {
                if (!state.selected) return;
                state.answered = true;
                showAnswerResult(type, questionItem, currentQuestion);
                answerBtn.disabled = true;
            });
            questionItem.appendChild(answerBtn);

            // 答案解析容器
            const answerResult = document.createElement('div');
            answerResult.className = 'answer-result';
            answerResult.id = `${type}-result`;
            questionItem.appendChild(answerResult);

            questionList.appendChild(questionItem);
        }

        // 显示答案解析
        function showAnswerResult(type, questionItem, question) {
            const state = quizState[type];
            const answerResult = questionItem.querySelector('.answer-result');
            const isCorrect = state.selected === question.correct;

            // 设置解析样式和内容
            answerResult.className = `answer-result ${isCorrect ? 'correct' : 'incorrect'}`;
            answerResult.innerHTML = `
                <h4>${isCorrect ? '✅ 回答正确' : '❌ 回答错误'}</h4>
                <p>正确答案：${question.correct}：${question.options[question.correct]}</p>
                <p>${question.explanation}</p>
                <div class="analysis">解析：${question.analysis}</div>
            `;
            answerResult.style.display = 'block';

            // 标记错误选项（如果答错）
            if (!isCorrect) {
                const options = questionItem.querySelectorAll('.option');
                options.forEach(opt => {
                    if (opt.dataset.key === state.selected) {
                        opt.classList.remove('selected');
                        opt.classList.add('wrong');
                    } else if (opt.dataset.key === question.correct) {
                        opt.classList.add('selected');
                    }
                });
            }
        }

        // 初始化分页导航
        function initPageNav(type, quizData) {
            const state = quizState[type];
            const prevBtn = document.getElementById(`prev-${type}`);
            const nextBtn = document.getElementById(`next-${type}`);
            const pageInfo = document.getElementById(`page-${type}`);

            // 更新分页信息
            function updatePageInfo() {
                pageInfo.textContent = `第 ${state.current + 1} / ${quizData[type].length} 题`;
                prevBtn.disabled = state.current === 0;
                nextBtn.disabled = state.current === quizData[type].length - 1;
            }

            // 上一题
            prevBtn.addEventListener('click', () => {
                if (state.current <= 0) return;
                state.current--;
                state.selected = null;
                state.answered = false;
                renderQuestion(type, quizData);
                updatePageInfo();
            });

            // 下一题
            nextBtn.addEventListener('click', () => {
                if (state.current >= quizData[type].length - 1) return;
                state.current++;
                state.selected = null;
                state.answered = false;
                renderQuestion(type, quizData);
                updatePageInfo();
            });

            // 初始化分页信息
            updatePageInfo();
        }
    </script>
</body>

</html>
