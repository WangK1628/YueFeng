<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速智能相册</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#7C3AED', secondary: '#C084FC' },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .gallery-card { @apply relative overflow-hidden rounded-xl bg-white shadow-md transition-all duration-500 hover:shadow-xl hover:-translate-y-1 cursor-pointer; }
            .img-fade { @apply opacity-0 transition-opacity duration-500; }
            .btn-gradient { @apply bg-gradient-to-r from-primary to-secondary text-white font-medium py-3 px-6 rounded-lg transition-all hover:scale-105; }
            .image-tag { @apply absolute top-3 left-3 bg-primary/80 text-white text-xs px-2 py-1 rounded-full backdrop-blur-sm; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <header class="py-10 px-4 text-center">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-[clamp(2rem,5vw,3.5rem)] font-bold text-slate-800 mb-3">极速相册</h1>
            <p class="text-slate-600 text-lg mb-6">并行扫描，实时渲染图片</p>
            <button id="refreshBtn" class="btn-gradient flex items-center gap-2 mx-auto">
                <i class="fa fa-refresh"></i>
                <span>获取相册图片</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        <div id="emptyTip" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <i class="fa fa-images text-6xl text-slate-300 mb-4"></i>
            <p class="text-xl text-slate-500">未找到符合规则的图片</p>
            <p class="text-slate-400">检查图片命名和路径后重试</p>
        </div>
        <div id="loadingTip" class="hidden text-center py-10">
            <i class="fa fa-spinner fa-spin text-primary text-3xl"></i>
            <p class="mt-3 text-slate-600">正在极速扫描图片...</p>
        </div>
    </main>

    <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <button id="closeBtn" class="absolute top-6 right-6 text-white text-3xl hover:text-primary transition-colors">
            <i class="fa fa-times"></i>
        </button>
        <button id="prevBtn" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 text-white text-4xl hover:text-primary">
            <i class="fa fa-chevron-left"></i>
        </button>
        <img id="lightboxImg" class="max-h-[85vh] max-w-[90vw] object-contain rounded-lg shadow-2xl" alt="预览">
        <button id="nextBtn" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 text-white text-4xl hover:text-primary">
            <i class="fa fa-chevron-right"></i>
        </button>
    </div>

    <script>
        // ===================== 配置项 =====================
        const CONFIG = {
            folder: './photo/',
            prefix: ['IMG', 'img'],
            numRange: [500, 600],
            ext: ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG'],
            parallelLimit: 10,
            timeout: 800
        };

        // 全局变量
        const imageList = [];
        let currentIndex = 0;
        const gallery = document.getElementById('gallery');
        const emptyTip = document.getElementById('emptyTip');
        const loadingTip = document.getElementById('loadingTip');
        const refreshBtn = document.getElementById('refreshBtn');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        // 单张图片检测
        function checkImageExist(url) {
            return new Promise((resolve) => {
                const img = new Image();
                const timer = setTimeout(() => resolve(false), CONFIG.timeout);
                img.onload = () => { clearTimeout(timer); resolve(true); };
                img.onerror = () => { clearTimeout(timer); resolve(false); };
                img.src = `${url}?t=${Date.now()}`;
            });
        }

        // 渲染单张图片卡片（实时渲染）
        function renderSingleCard(item, index) {
            const card = document.createElement('div');
            card.className = 'gallery-card';

            const tag = document.createElement('span');
            tag.className = 'image-tag';
            tag.textContent = 'IMG';

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = item.url;
            img.alt = `IMG_${item.num}`;
            img.className = 'w-full h-64 md:h-72 object-cover img-fade';

            img.onload = () => img.classList.remove('img-fade');
            img.onerror = () => img.src = `https://picsum.photos/seed=${index}/800/600`;

            // 灯箱点击事件
            img.addEventListener('click', () => {
                currentIndex = index;
                lightboxImg.src = item.url;
                lightbox.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            });

            card.appendChild(tag);
            card.appendChild(img);
            gallery.appendChild(card);
        }

        // 分批并行扫描 + 实时渲染
        async function batchParallelScan(nums) {
            // 清空旧数据
            gallery.innerHTML = '';
            imageList.length = 0;
            let validCount = 0;

            for (let i = 0; i < nums.length; i += CONFIG.parallelLimit) {
                const batch = nums.slice(i, i + CONFIG.parallelLimit);
                // 批量处理当前批次图片
                const batchPromises = batch.map(async (num) => {
                    for (const prefix of CONFIG.prefix) {
                        for (const ext of CONFIG.ext) {
                            const filePath = `${CONFIG.folder}${prefix}_${num}.${ext}`;
                            const exist = await checkImageExist(filePath);
                            if (exist) {
                                return { url: filePath, num };
                            }
                        }
                    }
                    return null;
                });

                // 等待当前批次完成
                const batchResults = await Promise.all(batchPromises);
                const validItems = batchResults.filter(item => item !== null);
                
                // 有效图片：加入列表 + 立即渲染
                validItems.forEach(item => {
                    imageList.push(item);
                    renderSingleCard(item, imageList.length - 1);
                    validCount++;
                });
            }

            // 扫描结束，隐藏加载状态
            loadingTip.classList.add('hidden');
            // 无图片时展示空状态
            if (validCount === 0) {
                emptyTip.classList.remove('hidden');
            }
        }

        // 初始化扫描
        async function autoScanImages() {
            // 重置所有状态
            emptyTip.classList.add('hidden');
            loadingTip.classList.remove('hidden');
            refreshBtn.disabled = true; // 防止重复点击

            // 生成数字列表
            const nums = [];
            for (let num = CONFIG.numRange[0]; num <= CONFIG.numRange[1]; num++) {
                nums.push(num);
            }

            // 开始扫描
            await batchParallelScan(nums);
            refreshBtn.disabled = false;
        }

        // ===================== 灯箱控制 =====================
        document.getElementById('closeBtn').addEventListener('click', () => {
            lightbox.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        function switchImg(dir) {
            if (imageList.length === 0) return;
            currentIndex = dir === 'prev' 
                ? (currentIndex <= 0 ? imageList.length - 1 : currentIndex - 1)
                : (currentIndex >= imageList.length - 1 ? 0 : currentIndex + 1);
            lightboxImg.src = imageList[currentIndex].url;
        }

        document.getElementById('prevBtn').addEventListener('click', () => switchImg('prev'));
        document.getElementById('nextBtn').addEventListener('click', () => switchImg('next'));
        
        // 按钮绑定事件
        refreshBtn.addEventListener('click', autoScanImages);
        
        // 点击空白处关闭灯箱
        lightbox.addEventListener('click', e => {
            if (e.target === lightbox) {
                lightbox.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') {
                    lightbox.classList.add('hidden');
                    document.body.style.overflow = 'auto';
                }
                if (e.key === 'ArrowLeft') switchImg('prev');
                if (e.key === 'ArrowRight') switchImg('next');
            }
        });
    </script>
</body>
</html>
